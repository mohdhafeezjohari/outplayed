services:
  game:
    build: .
    image: ghcr.io/mohdhafeezjohari/outplayed:latest
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      DATABASE_PATH: /data/outplayed.db
    volumes:
      - outplayed-data:/data
    restart: unless-stopped

volumes:
  outplayed-data:
